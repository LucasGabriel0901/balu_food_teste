<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BALU Food | Redirecionando</title>

  <style>
    :root {
      --purple: #6d28d9;
      --green: #16a34a;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(109, 40, 217, 0.12), transparent 32%),
        radial-gradient(circle at bottom right, rgba(22, 163, 74, 0.12), transparent 32%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .loading-card {
      width: 100%;
      max-width: 420px;
      padding: 34px;
      border-radius: 28px;
      background: #ffffff;
      border: 1px solid var(--border);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    .brand-mark {
      width: 64px;
      height: 64px;
      border-radius: 22px;
      margin: 0 auto 18px;
      background: linear-gradient(135deg, var(--purple), var(--green));
      color: #ffffff;
      font-weight: 900;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 40px rgba(109, 40, 217, 0.28);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: -0.8px;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .loader {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 4px solid #ede9fe;
      border-top-color: var(--purple);
      margin: 24px auto 0;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

</head>

<body>
  <main class="loading-card">
    <div class="brand-mark">B</div>


<h1>BALU Food</h1>

<p id="redirectMessage">
  Verificando acesso ao sistema...
</p>

<div class="loader"></div>


  </main>

  <script>
    var AUTH_SESSION_KEY = "balu_auth_session";

    function redirecionar() {
      var mensagem = document.getElementById("redirectMessage");
      var sessaoTexto = localStorage.getItem(AUTH_SESSION_KEY);

      if (!sessaoTexto) {
        if (mensagem) {
          mensagem.textContent = "Você será direcionado para a tela de login.";
        }

        setTimeout(function () {
          window.location.href = "./pages/login.html";
        }, 700);

        return;
      }

      try {
        var sessao = JSON.parse(sessaoTexto);

        if (sessao && sessao.acesso_liberado === true) {
          if (mensagem) {
            mensagem.textContent = "Acesso encontrado. Abrindo seu dashboard...";
          }

          setTimeout(function () {
            window.location.href = "./pages/dashboard.html";
          }, 700);

          return;
        }

        localStorage.removeItem(AUTH_SESSION_KEY);

        if (mensagem) {
          mensagem.textContent = "Sessão inválida. Redirecionando para o login.";
        }

        setTimeout(function () {
          window.location.href = "./pages/login.html";
        }, 700);
      } catch (erro) {
        localStorage.removeItem(AUTH_SESSION_KEY);

        if (mensagem) {
          mensagem.textContent = "Sessão corrompida. Redirecionando para o login.";
        }

        setTimeout(function () {
          window.location.href = "./pages/login.html";
        }, 700);
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      redirecionar();
    });
  </script>

</body>
</html>
